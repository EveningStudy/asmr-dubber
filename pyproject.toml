[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asmr-dubber"
version = "0.1.0"
description = "Japanese ASMR to Chinese voice-cloned sentence dubbing for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ASMR", "Japanese", "Chinese", "voice-cloning", "dubbing", "TTS", "ASR"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=14.0,<17",
  "huggingface-hub==0.36.0",
  "hf-xet>=1.1,<2",
  "httpx>=0.28.0",
  "imageio-ffmpeg>=0.6.0",
  "numpy==2.3.5",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "soundfile>=0.13.0",
  "soxr>=0.5.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
ui = ["gradio==6.17.3"]
# The application shell intentionally stays small and portable. Local AI
# stacks are optional because their PyTorch/Python requirements differ widely.
local-default = [
  "datasets==3.6.0",
  "numba==0.63.1",
  "llvmlite==0.46.0",
  "pynndescent==0.5.13",
  "qwen-asr==0.0.6",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.13.0",
  "transformers==4.57.6",
  "voxcpm==2.0.3",
]
asr-faster-whisper = [
  "faster-whisper>=1.2.1,<2",
  # CTranslate2's Windows CUDA build targets CUDA 12. PyTorch may use a
  # newer bundled CUDA runtime, so ship the required BLAS runtime explicitly.
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32'",
]
asr-kotoba-whisper = [
  "accelerate>=1.10,<2",
  "torch>=2.6,<2.12",
  "torchaudio>=2.6,<2.12",
  "transformers>=4.57,<5",
]
asr-openai-whisper = ["openai-whisper>=20250625"]
asr-funasr = ["funasr>=1.3.0,<2"]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
asmr-dubber = "asmr_dubber.cli:app"
asmr-dubber-ui = "asmr_dubber.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asmr_dubber"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/launcher",
  "/ASMR-Dubber.exe",
  "/README.md",
  "/LICENSE",
  "/docs",
  "/.github",
  "/.editorconfig",
  "/.env.example",
  "/.gitattributes",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
