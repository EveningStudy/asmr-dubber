[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asmr-dubber"
version = "1.3.1"
description = "Japanese or English ASMR to Chinese voice-cloned dubbing for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ASMR Dubber contributors"}]
maintainers = [{name = "ASMR Dubber maintainers"}]
keywords = ["ASMR", "Japanese", "English", "Chinese", "voice-cloning", "dubbing", "TTS", "ASR"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: GPU :: NVIDIA CUDA",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=14.0,<17",
  "edge-tts>=7.2.7,<8",
  "huggingface-hub==0.36.0",
  "hf-xet>=1.1,<2",
  "httpx>=0.28.0",
  "imageio-ffmpeg>=0.6.0",
  "numpy==2.3.5",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "soundfile>=0.13.0",
  "soxr>=0.5.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
ui = ["gradio==6.17.3"]
# Only the three supported recognition families live in the main environment.
# IndexTTS2 is intentionally isolated and external synthesis services need no
# extra Python stack in this application.
asr-faster-whisper = [
  "faster-whisper>=1.2.1,<2",
  # CTranslate2's Windows CUDA build targets CUDA 12. PyTorch may use a
  # newer bundled CUDA runtime, so ship the required BLAS runtime explicitly.
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32'",
]
asr-kotoba-whisper = [
  "accelerate>=1.10,<2",
  "torch>=2.6,<2.12",
  "torchaudio>=2.6,<2.12",
  "transformers>=4.57,<5",
]
asr-forced-aligner = [
  "qwen-asr==0.0.6",
  "torch>=2.6,<2.12",
  "torchaudio>=2.6,<2.12",
  "transformers>=4.57,<5",
]
asr-asmr-vad = [
  "onnxruntime>=1.20,<2",
  "transformers>=4.57,<5",
]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/EveningStudy/asmr-dubber"
Documentation = "https://github.com/EveningStudy/asmr-dubber/tree/main/docs"
Repository = "https://github.com/EveningStudy/asmr-dubber.git"
Issues = "https://github.com/EveningStudy/asmr-dubber/issues"
"Release notes" = "https://github.com/EveningStudy/asmr-dubber/blob/main/docs/RELEASE.md"

[project.scripts]
asmr-dubber = "asmr_dubber.cli:app"
asmr-dubber-ui = "asmr_dubber.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asmr_dubber"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/launcher",
  "/assets",
  "/ASMR-Dubber.exe",
  "/ASMR-Dubber-Setup.exe",
  "/mirrors.json",
  "/modelscope-artifacts.lock.json",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/docs",
  "/.github",
  "/.editorconfig",
  "/.env.example",
  "/.gitattributes",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: exercises a complete local user workflow and writes real media",
  "slow: may take noticeably longer than the core test suite",
  "network: requires an external service or download",
  "gpu: requires a working CUDA device",
  "linux: requires a Linux or WSL runtime",
]

[tool.pyright]
include = ["src/asmr_dubber"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PERF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/asmr_dubber/ui.py" = ["B008"]
