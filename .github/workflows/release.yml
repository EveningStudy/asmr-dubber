name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8fab2abe27877764daaa2c604fb15ec4ca40c608
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - name: Build Windows launcher
        shell: pwsh
        run: ./launcher/windows/build.ps1
      - name: Build portable Windows source archive
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "ASMR-Dubber"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @(".git", ".asmr-dubber", "dist")
          } | Copy-Item -Destination $staging -Recurse -Force
          $portable = Join-Path $staging ".asmr-dubber"
          $uvDir = Join-Path $portable "bootstrap\windows\uv"
          $pythonDir = Join-Path $portable "runtimes\python"
          New-Item -ItemType Directory -Force $uvDir, $pythonDir | Out-Null
          Copy-Item (Get-Command uv.exe).Source (Join-Path $uvDir "uv.exe") -Force
          $env:UV_PYTHON_INSTALL_DIR = $pythonDir
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-python-cache"
          uv python install 3.12 --managed-python --no-bin
          if (-not (Test-Path (Join-Path $uvDir "uv.exe"))) {
            throw "Portable archive is missing uv.exe."
          }
          if (-not (Get-ChildItem $pythonDir -Filter "python.exe" -File -Recurse)) {
            throw "Portable archive is missing Python 3.12."
          }
          Compress-Archive -Path $staging `
            -DestinationPath "ASMR-Dubber-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ASMR-Dubber-windows-portable.zip
          if-no-files-found: error

  github-release:
    needs: windows-launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8fab2abe27877764daaa2c604fb15ec4ca40c608
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: v0.2.0
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match {expected}")
          PY
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Replace GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 8fab2abe27877764daaa2c604fb15ec4ca40c608
        run: |
          git tag -f "v0.2.0" "$RELEASE_COMMIT"
          git push --force origin "refs/tags/v0.2.0"
          gh release upload "v0.2.0" \
            dist/* \
            release-assets/ASMR-Dubber-windows-portable.zip \
            --clobber
