name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 989a5248671e61481f6bbfeaa4e9121145e97ebf
      - name: Build Windows launcher
        shell: pwsh
        run: ./launcher/windows/build.ps1
      - name: Build portable Windows source archive
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "ASMR-Dubber"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @(".git", ".asmr-dubber", "dist")
          } | Copy-Item -Destination $staging -Recurse -Force
          Compress-Archive -Path $staging `
            -DestinationPath "ASMR-Dubber-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ASMR-Dubber-windows-portable.zip
          if-no-files-found: error

  github-release:
    needs: windows-launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 989a5248671e61481f6bbfeaa4e9121145e97ebf
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - name: Verify package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version != "0.2.0":
              raise SystemExit(f"package version {version} does not match 0.2.0")
          PY
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v0.2.0"
          dist/*
          release-assets/ASMR-Dubber-windows-portable.zip
          --target "989a5248671e61481f6bbfeaa4e9121145e97ebf"
          --title "v0.2.0"
          --notes ""
