name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build Windows launcher
        shell: pwsh
        run: ./launcher/windows/build.ps1
      - name: Build portable Windows source archive
        id: portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag does not contain a valid semantic version: ${{ github.ref_name }}"
          }
          $archiveName = "ASMR-Dubber-windows-portable-v$version.zip"
          $staging = Join-Path $env:RUNNER_TEMP "ASMR-Dubber"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @(".git", ".asmr-dubber", "dist")
          } | Copy-Item -Destination $staging -Recurse -Force
          $portable = Join-Path $staging ".asmr-dubber"
          $uvDir = Join-Path $portable "bootstrap\windows\uv"
          $pythonDir = Join-Path $portable "runtimes\python"
          $coreWheelhouse = Join-Path $staging "vendor\windows-core-wheelhouse"
          $coreRequirements = Join-Path $env:RUNNER_TEMP "windows-core-requirements.txt"
          New-Item -ItemType Directory -Force $uvDir, $pythonDir, $coreWheelhouse | Out-Null
          Copy-Item (Get-Command uv.exe).Source (Join-Path $uvDir "uv.exe") -Force
          uv export --frozen --no-dev --extra ui --no-emit-project --no-hashes `
            --format requirements.txt --output-file $coreRequirements
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to export locked Windows core requirements."
          }
          python -m pip download --disable-pip-version-check `
            --only-binary=:all: --dest $coreWheelhouse `
            --requirement $coreRequirements hatchling "editables~=0.3" `
            "setuptools>=78.1.1,<82"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to prepare bundled Windows core wheels."
          }
          $env:UV_PYTHON_INSTALL_DIR = $pythonDir
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-python-cache"
          uv python install 3.12 --managed-python --no-bin
          if (-not (Test-Path (Join-Path $uvDir "uv.exe"))) {
            throw "Portable archive is missing uv.exe."
          }
          if (-not (Get-ChildItem $pythonDir -Filter "python.exe" -File -Recurse)) {
            throw "Portable archive is missing Python 3.12."
          }
          $requiredWheels = @(
            "edge_tts-*.whl",
            "editables-*.whl",
            "gradio-*.whl",
            "httpx-*.whl",
            "hatchling-*.whl"
          )
          foreach ($pattern in $requiredWheels) {
            if (-not (Get-ChildItem $coreWheelhouse -Filter $pattern -File)) {
              throw "Portable archive is missing required wheel: $pattern"
            }
          }
          $smokeVenv = Join-Path $env:RUNNER_TEMP "windows-core-wheelhouse-smoke"
          $smokePython = Join-Path $smokeVenv "Scripts\python.exe"
          uv venv --python 3.12 $smokeVenv
          uv pip install --python $smokePython --offline --find-links $coreWheelhouse `
            --editable "${staging}[ui]" "setuptools>=78.1.1,<82"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Windows core wheelhouse failed its offline install smoke test."
          }
          & $smokePython -c "import asmr_dubber.ui, edge_tts, gradio, httpx, setuptools"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Windows core wheelhouse failed its runtime import smoke test."
          }
          Compress-Archive -Path $staging `
            -DestinationPath $archiveName
          "archive=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ steps.portable.outputs.archive }}
          if-no-files-found: error

  github-release:
    needs: windows-launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match {expected}")
          PY
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Prepare release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = Path("docs/RELEASE.md").read_text(encoding="utf-8").strip()
          if not notes:
              raise SystemExit("docs/RELEASE.md is empty")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          release-assets/ASMR-Dubber-windows-portable-v*.zip
          --notes-file release-notes.md
          --verify-tag
